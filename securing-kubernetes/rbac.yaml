apiVersion: v1
kind: ServiceAccount
metadata:
  name: payments-sa
  namespace: payments-ns-with-rq

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: payments-role
  namespace: payments-ns-with-rq
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payments-rolebinding
  namespace: payments-ns-with-rq
subjects:
- kind: ServiceAccount
  name: payments-sa
  namespace: payments-ns-with-rq
roleRef:
  kind: Role
  name: payments-role
  apiGroup: rbac.authorization.k8s.io
